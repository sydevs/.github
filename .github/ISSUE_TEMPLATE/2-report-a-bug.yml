name: Report a bug
description: Something is broken or behaves in a way it should not.
type: Bug
body:
  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - Sahaj Atlas (the map of meditation classes)
        - We Meditate (wemeditate.com)
        - The content system behind them
        - Not sure
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did it happen?
      description: The page address (URL), or the website where the map is shown.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The smallest set of steps you can find.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
